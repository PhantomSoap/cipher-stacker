<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Cipher Stacker - Ratzilla DOM</title>
    <link
      rel="stylesheet"
      href="https://cloudflare.com"
    />
    <!-- Trunk configuration hook for compiling the Rust binary to WASM -->
    <link data-trunk rel="rust" />
    <style>
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #121212;
        color: #ffffff;
        overflow: hidden;
      }

      /* Fixes layout distortion by controlling Ratzilla text node flows */
      body, div, pre, span {
        font-family: "Fira Code", monospace !important;
        font-size: 14px;              /* Controls default layout scaling */
        line-height: 1.15;            /* Tightens line steps to prevent tearing */
        white-space: pre !important;   /* Forces the DOM to respect terminal spaces */
        letter-spacing: 0px;
        word-spacing: 0px;
      }
    </style>
  </head>
  <body>
    <!-- Ratzilla's DomBackend will dynamically append grid lines here -->

    <script type="module">
      window.addEventListener("TrunkApplicationStarted", (_) => {
        console.log("Cipher Stacker initialized via Ratzilla DOM Backend.");
      });
    </script>
  </body>
</html>
